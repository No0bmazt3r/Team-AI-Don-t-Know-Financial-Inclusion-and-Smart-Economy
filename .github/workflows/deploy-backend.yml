# Deploys the backend container to AWS (ECS Express Mode) only when the repository owner starts it by hand:
# Actions → "Deploy backend (AWS)" → Run workflow (branch: main). Independent of the frontend deploy.
# The checks workflow must already have passed for the exact commit. Database migrations run as the new task starts.
# AWS access is through OIDC (role coinvoy-github-deploy, only usable from the "production" environment): no stored keys.
name: Deploy backend (AWS)

on:
  workflow_dispatch:

run-name: Deploy backend for ${{ github.sha }}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify Coinvoy checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Coinvoy checks has not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Coinvoy checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Coinvoy checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to ECS
    needs: [verify-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token AWS trusts
    env:
      AWS_REGION: ap-southeast-1
      SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/coinvoy-github-deploy
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image (tagged with the commit)
        id: image
        run: |
          image="${{ steps.ecr.outputs.registry }}/coinvoy-api:$GITHUB_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Tags are immutable: a re-run for the same commit reuses the image it already pushed
          if aws ecr describe-images --repository-name coinvoy-api --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image for $GITHUB_SHA already in ECR."
            exit 0
          fi
          docker build -f backend/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t "$image" .
          docker push "$image"
      - name: Point the service at the new image
        run: |
          # Update only the image: read the running container config and send it back with the new image, so the
          # environment and secrets Terraform set stay as they are
          container=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[0].primaryContainer' --output json \
            | jq -c --arg image "${{ steps.image.outputs.image }}" '.image = $image')
          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --primary-container "$container" >/dev/null
      - name: Wait until the new task is healthy
        run: |
          # Follows the ECS deployment itself instead of `aws ecs wait services-stable`, which gives up after a fixed
          # 10 minutes and says nothing about why. Express Mode deploys (migrations, health checks, draining the old
          # task) can take longer; a failure prints the service events, stopped tasks and recent logs.
          cluster=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --query 'service.cluster' --output text)
          diagnose() {
            echo "::group::Service events"
            aws ecs describe-services --cluster "$cluster" --services "$SERVICE_ARN" \
              --query 'services[0].events[:15].[createdAt,message]' --output text || true
            echo "::endgroup::"
            echo "::group::Stopped tasks"
            tasks=$(aws ecs list-tasks --cluster "$cluster" --service-name "${SERVICE_ARN##*/}" --desired-status STOPPED --query 'taskArns[:3]' --output text || true)
            [ -n "$tasks" ] && [ "$tasks" != "None" ] && aws ecs describe-tasks --cluster "$cluster" --tasks $tasks \
              --query 'tasks[].{stopped:stoppedReason,containers:containers[].[name,exitCode,reason]}' --output json || true
            echo "::endgroup::"
            echo "::group::Last 15 minutes of /ecs/coinvoy-api"
            aws logs filter-log-events --log-group-name /ecs/coinvoy-api --start-time $(( ($(date +%s) - 900) * 1000 )) \
              --query 'events[-60:].message' --output text || true
            echo "::endgroup::"
          }
          for _ in $(seq 1 90); do # 90 × 20 s = 30 minutes
            read -r status reason < <(aws ecs list-service-deployments --cluster "$cluster" --service "$SERVICE_ARN" \
              --output json | jq -r '.serviceDeployments | max_by(.createdAt) | "\(.status) \(.statusReason // "")"')
            echo "$(date +%T) deployment: $status $reason"
            case "$status" in
              SUCCESSFUL)
                echo "Backend running ${{ steps.image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              STOPPED|ROLLBACK_*)
                echo "::error::Deployment $status: $reason (ECS keeps the previous task running)"
                diagnose
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Deployment still not finished after 30 minutes"
          diagnose
          exit 1
