# Deploys the app (frontend/) to S3 behind CloudFront, only when the repository owner starts it by hand:
# Actions → "Deploy app (AWS)" → Run workflow (branch: main). Independent of the backend deploy.
# Pushes, pull requests and merges never trigger it.
#
# The run gates deployment in this order:
#   1. Confirm that the separate "Coinvoy checks" workflow passed for this exact commit.
#   2. Wait for the production environment approval (if configured), then upload to S3 and refresh CloudFront.
#
# Why nobody else can deploy:
# - The jobs run only if the owner both started the run and (for a re-run) clicked re-run, and only on main.
# - AWS access is the coinvoy-github-deploy role, which only trusts jobs in the "production" GitHub Environment,
#   which only main may use. A collaborator who edits this file on another branch can't assume it; main itself can't
#   change without the owner's approval (the protect-main ruleset).
# Setup: README → Deployment.
name: Deploy app (AWS)

on:
  workflow_dispatch:

# One deployment at a time; a second click waits for the first to finish
concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify Coinvoy checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Coinvoy checks has not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Coinvoy checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Coinvoy checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [verify-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token AWS trusts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter coinvoy-frontend
      - run: pnpm --filter coinvoy-frontend build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/coinvoy-github-deploy
          aws-region: ap-southeast-1
      - name: Upload to S3
        working-directory: frontend/dist
        run: |
          bucket="s3://coinvoy-web-${{ vars.AWS_ACCOUNT_ID }}"
          # Hashed files never change: cache for a year. Upload them first so the new index.html never points at
          # files that aren't there yet.
          aws s3 sync assets "$bucket/assets" --cache-control "public, max-age=31536000, immutable"
          # Everything else (index.html, sw.js, manifest, icons) is checked on every load
          aws s3 sync . "$bucket" --exclude "assets/*" --cache-control "no-cache" --delete
          # Old hashed files go last, once nothing new points at them
          aws s3 sync assets "$bucket/assets" --cache-control "public, max-age=31536000, immutable" --delete
      - name: Refresh CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$id"
          echo "App deployed for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
